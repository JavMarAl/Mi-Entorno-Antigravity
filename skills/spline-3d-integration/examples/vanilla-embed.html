<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spline Vanilla Embed</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #spline-viewer {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.28/build/spline-viewer.js"></script>
    
    <!-- Using the viewer component with a sample URL -->
    <spline-viewer id="spline-viewer" url="https://prod.spline.design/your-scene-id/scene.splinecode"></spline-viewer>

    <script>
        // Check for WebGL support fallback
        const viewer = document.getElementById('spline-viewer');
        if (!window.WebGLRenderingContext) {
            viewer.outerHTML = '<div style="color: white; padding: 20px;">Your browser does not support WebGL. Here is a 3D-ish image instead!</div>';
        }
    </script>
</body>
</html>
