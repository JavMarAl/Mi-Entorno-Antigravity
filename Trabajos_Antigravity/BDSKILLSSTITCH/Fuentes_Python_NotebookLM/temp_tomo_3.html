<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tomo Python</title>
    
    <style>
    @media print {
        body { margin: 0; padding: 0; font-family: serif; background: #fff; color: #000; display: block; height: auto; overflow: visible; }
        #sidebar, #go-top, nav, footer { display: none !important; }
        #main-content { padding: 0; margin: 0; width: 100%; display: block; overflow: visible; height: auto; flex: none; }
        pre, code { background: #eee; font-family: monospace; }
        pre { white-space: pre-wrap; word-break: break-all; }
        .module-section { page-break-after: always; padding-bottom: 20px; border-bottom: 1px solid #ccc; }
        h1, h2, h3, h4 { color: #000; }
    }
    /* Estilos para que tambien se vea normal si lo abren, o si playwright usa print nativo fallando */
    body { display: block; height: auto; overflow: visible; background: #fff; color: #000; }
    #main-content { display: block; height: auto; overflow: visible; }
    </style>

</head>
<body>
    <main id="main-content">
        {CONTENIDO}
    </main>
</body>
</html>
