<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Master - Nivel Aprendiz</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- CodeMirror Core CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <!-- CodeMirror Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <!-- Main Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">🐍</span>
                <span class="logo-text">Python<span class="highlight">Master</span></span>
            </div>
            <nav class="nav-menu">
                <button class="nav-btn active" data-target="theory-basics">
                    <span class="icon">📚</span> Teoría Básica
                </button>
                <button class="nav-btn" data-target="theory-python">
                    <span class="icon">🧠</span> Conceptos Python
                </button>
                <button class="nav-btn" data-target="code-practice">
                    <span class="icon">💻</span> Práctica de Código
                </button>
                <button class="nav-btn" data-target="sql-practice" style="opacity: 0.6; cursor: not-allowed;"
                    title="Próximamente">
                    <span class="icon">🗄️</span> SQL Mastery (Próximamente)
                </button>
            </nav>
            <div class="user-progress">
                <p>Nivel: <strong id="user-level-text" class="highlight">Aprendiz</strong></p>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="overall-progress" style="width: 0%;"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <h1 id="section-title">Teoría sobre Programación</h1>
                <div class="header-actions" style="display: flex; gap: 1rem; align-items: center;">
                    <span class="status-badge" id="mode-badge">Modo Cuestionario</span>
                    <button id="ask-ai" class="btn ai-assist">✨ Asistente IA</button>
                </div>
            </header>

            <!-- Quiz Section (Reusable for both theory types) -->
            <section id="quiz-section" class="content-section active">
                <div class="quiz-card glass-panel" id="quiz-container">
                    <!-- Loading state -->
                    <div class="loading-spinner">Cargando preguntas...</div>
                </div>
            </section>

            <!-- Code Practice Section -->
            <section id="code-practice" class="content-section">
                <div class="code-workspace">
                    <div class="exercise-panel glass-panel">
                        <h2 id="exercise-title">Práctica de Código</h2>
                        <p id="exercise-desc">Selecciona un ejercicio para comenzar.</p>
                        <div class="exercise-hint" id="exercise-hint" style="display: none;">
                            <strong>Pista:</strong> <span id="hint-text"></span>
                        </div>
                        <div class="solution-panel" id="solution-panel"
                            style="display: none; margin-top: 1rem; padding: 1rem; background: rgba(16, 185, 129, 0.1); border-left: 4px solid #10b981; border-radius: 4px;">
                            <h4
                                style="margin-top: 0; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 0.5rem;">
                                💡 Solución del Experto</h4>
                            <pre><code id="solution-code" style="color: #6ee7b7; display: block; padding: 0.75rem; background: rgba(0,0,0,0.3); border-radius: 4px; overflow-x: auto; font-family: 'Fira Code', monospace; font-size: 0.9rem;"></code></pre>
                            <p id="solution-explanation"
                                style="margin-top: 0.75rem; font-size: 0.95rem; line-height: 1.5; color: #d1d5db;"></p>
                        </div>
                        <div class="exercise-controls">
                            <button id="prev-exercise" class="btn secondary">Anterior</button>
                            <span id="exercise-counter">1 / 100</span>
                            <button id="next-exercise" class="btn secondary">Siguiente</button>
                        </div>
                    </div>

                    <div class="editor-panel glass-panel">
                        <div class="editor-header">
                            <span>main.py</span>
                            <div style="display: flex; gap: 0.5rem;">
                                <button id="show-solution" class="btn secondary"
                                    style="background-color: #0f172a; border-color: #10b981; color: #10b981;">💡 Ver
                                    Solución</button>
                                <button id="run-code" class="btn primary">▶ Ejecutar</button>
                            </div>
                        </div>
                        <textarea id="code-editor" spellcheck="false"># Escribe tu código aquí
</textarea>

                        <div class="terminal-panel">
                            <div class="terminal-header">
                                <span>Salida / Terminal</span>
                                <button id="btn-explain-error" class="btn ai-assist"
                                    style="display: none; background: linear-gradient(90deg, #ef4444, #f97316); font-size: 0.75rem; padding: 0.15rem 0.6rem;">🧐
                                    Explicar Error</button>
                            </div>
                            <div id="terminal-output" class="terminal-output">
                                Listo para ejecutar...
                            </div>
                        </div>
                    </div>
                </div>
    </div>
    </section>

    <!-- AI Overlay Chat (Moved to Root to prevent UI blocking) -->
    <div id="ai-chat-panel" class="ai-chat-panel" style="display: none;">
        <div class="ai-header">🤖 Asistente IA <button id="close-ai" class="close-btn">×</button></div>
        <div class="ai-messages" id="ai-messages"></div>
        <div class="ai-input-area">
            <input type="text" id="ai-input" placeholder="Pregunta sobre tu código...">
            <button id="send-ai" class="send-btn">Enviar</button>
        </div>
    </div>

    </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
